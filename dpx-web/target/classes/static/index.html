<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPX – Courier Delivery Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --dpx-blue: #1a56db;
      --dpx-dark: #1e2a3a;
      --dpx-light: #f0f4ff;
    }
    body { background: #f8fafc; font-family: 'Segoe UI', sans-serif; }

    /* Navbar */
    .navbar { background: var(--dpx-dark); }
    .navbar-brand { font-weight: 700; font-size: 1.3rem; letter-spacing: 1px; color: #fff !important; }
    .navbar-brand span { color: #60a5fa; }

    /* Stats cards */
    .stat-card { border-radius: 12px; border: none; transition: transform .15s; }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-icon { font-size: 2rem; opacity: .85; }

    /* Table */
    .table-card { border-radius: 14px; overflow: hidden; border: none;
                  box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .table thead { background: var(--dpx-dark); color: #fff; }
    .table thead th { font-weight: 600; border: none; padding: .85rem 1rem; }
    .table tbody tr { transition: background .12s; }
    .table tbody tr:hover { background: #f0f4ff; }
    .table td { vertical-align: middle; padding: .75rem 1rem; }

    /* Status badges */
    .badge-pending    { background: #fef3c7; color: #92400e; }
    .badge-transit    { background: #dbeafe; color: #1e40af; }
    .badge-delivered  { background: #d1fae5; color: #065f46; }
    .badge-cancelled  { background: #fee2e2; color: #991b1b; }
    .status-badge { font-size: .8rem; padding: .35em .75em; border-radius: 20px;
                    font-weight: 600; display: inline-block; }

    /* Buttons */
    .btn-dpx { background: var(--dpx-blue); color: #fff; border: none; border-radius: 8px; }
    .btn-dpx:hover { background: #1447c4; color: #fff; }
    .btn-action { padding: .25rem .55rem; font-size: .82rem; border-radius: 6px; }

    /* Search bar */
    .search-input { border-radius: 8px 0 0 8px; border: 1.5px solid #d1d5db; }
    .search-input:focus { border-color: var(--dpx-blue); box-shadow: none; }
    .search-btn { border-radius: 0 8px 8px 0; }

    /* Toast */
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    .toast-msg { min-width: 260px; border-radius: 10px; font-size: .9rem; }

    /* Modal */
    .modal-header { background: var(--dpx-dark); color: #fff; border-radius: 12px 12px 0 0; }
    .modal-header .btn-close { filter: invert(1); }
    .modal-content { border-radius: 12px; border: none; }
    .form-label { font-weight: 600; font-size: .88rem; color: #374151; }
    .form-control, .form-select { border-radius: 8px; font-size: .92rem; }
    .form-control:focus, .form-select:focus { border-color: var(--dpx-blue); box-shadow: none; }
  </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark px-4 py-2">
  <span class="navbar-brand"><i class="bi bi-truck me-2"></i>DPX<span> Courier</span></span>
  <span class="text-secondary small">Delivery Management System &nbsp;|&nbsp; DAT1080P</span>
</nav>

<!-- ── Stats ───────────────────────────────────────────────────────────────── -->
<div class="container-fluid px-4 mt-4">
  <div class="row g-3 mb-4" id="stats-row">
    <div class="col-6 col-md-3">
      <div class="stat-card card p-3 bg-white">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">Total</div>
            <div class="fw-bold fs-4" id="stat-total">–</div>
          </div>
          <i class="bi bi-box-seam stat-icon text-primary"></i>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card card p-3 bg-white">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">Pending</div>
            <div class="fw-bold fs-4" id="stat-pending">–</div>
          </div>
          <i class="bi bi-hourglass-split stat-icon text-warning"></i>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card card p-3 bg-white">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">In Transit</div>
            <div class="fw-bold fs-4" id="stat-transit">–</div>
          </div>
          <i class="bi bi-truck stat-icon text-info"></i>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card card p-3 bg-white">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">Delivered</div>
            <div class="fw-bold fs-4" id="stat-delivered">–</div>
          </div>
          <i class="bi bi-check-circle stat-icon text-success"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
    <div class="input-group" style="max-width:340px">
      <input type="text" id="search-input" class="form-control search-input"
             placeholder="Search by ID, name, address…" />
      <button class="btn btn-dpx search-btn" onclick="loadDeliveries()">
        <i class="bi bi-search"></i>
      </button>
    </div>
    <button class="btn btn-dpx ms-auto" onclick="openCreateModal()">
      <i class="bi bi-plus-lg me-1"></i> New Delivery
    </button>
  </div>

  <!-- ── Table ───────────────────────────────────────────────────────────── -->
  <div class="table-card card mb-5">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Sender</th>
            <th>Recipient</th>
            <th>Address</th>
            <th>Weight (kg)</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="delivery-table-body">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Create / Edit Modal ─────────────────────────────────────────────────── -->
<div class="modal fade" id="deliveryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">New Delivery</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label">Delivery ID *</label>
          <input type="text" id="f-id" class="form-control" placeholder="e.g. DPX006" />
        </div>
        <div class="mb-3">
          <label class="form-label">Sender Name *</label>
          <input type="text" id="f-sender" class="form-control" placeholder="Full name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Recipient Name *</label>
          <input type="text" id="f-recipient" class="form-control" placeholder="Full name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Delivery Address *</label>
          <input type="text" id="f-address" class="form-control" placeholder="Street, City" />
        </div>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label">Weight (kg) *</label>
            <input type="number" id="f-weight" class="form-control" placeholder="e.g. 2.5" step="0.1" min="0.1" />
          </div>
          <div class="col-6">
            <label class="form-label">Status</label>
            <select id="f-status" class="form-select">
              <option value="Pending">Pending</option>
              <option value="In Transit">In Transit</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div id="modal-error" class="alert alert-danger mt-3 d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-dpx" id="modal-save-btn" onclick="saveDelivery()">
          <i class="bi bi-save me-1"></i> Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Delete Confirm Modal ────────────────────────────────────────────────── -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header" style="background:#dc3545">
        <h5 class="modal-title text-white">Confirm Delete</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center py-3">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-2 mb-2 d-block"></i>
        <p>Delete delivery <strong id="delete-id-label"></strong>?</p>
        <p class="text-muted small mb-0">This cannot be undone.</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="confirmDelete()">
          <i class="bi bi-trash me-1"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast ───────────────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
  const API = '/api/deliveries';
  let editingId = null;
  let deletingId = null;

  // ── Status badge helper ───────────────────────────────────────────────────
  function statusBadge(status) {
    const map = {
      'Pending':    'badge-pending',
      'In Transit': 'badge-transit',
      'Delivered':  'badge-delivered',
      'Cancelled':  'badge-cancelled'
    };
    return `<span class="status-badge ${map[status] || 'bg-secondary text-white'}">${status}</span>`;
  }

  // ── Load all deliveries ───────────────────────────────────────────────────
  async function loadDeliveries() {
    const q = document.getElementById('search-input').value.trim();
    const url = q ? `${API}?search=${encodeURIComponent(q)}` : API;
    try {
      const res = await fetch(url);
      const data = await res.json();
      const tbody = document.getElementById('delivery-table-body');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No deliveries found.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(d => `
        <tr>
          <td><strong>${d.id}</strong></td>
          <td>${d.senderName}</td>
          <td>${d.recipientName}</td>
          <td>${d.address}</td>
          <td>${d.weight} kg</td>
          <td>${statusBadge(d.status)}</td>
          <td class="text-center">
            <button class="btn btn-outline-primary btn-action me-1" onclick="openEditModal('${d.id}')">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-outline-danger btn-action" onclick="openDeleteModal('${d.id}')">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      showToast('Failed to load deliveries. Is the server running?', 'danger');
    }
  }

  // ── Load stats ────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const res = await fetch(`${API}/stats`);
      const s = await res.json();
      document.getElementById('stat-total').textContent     = s.total     ?? 0;
      document.getElementById('stat-pending').textContent   = s.Pending   ?? 0;
      document.getElementById('stat-transit').textContent   = s['In Transit'] ?? 0;
      document.getElementById('stat-delivered').textContent = s.Delivered ?? 0;
    } catch {}
  }

  // ── Open create modal ─────────────────────────────────────────────────────
  function openCreateModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'New Delivery';
    document.getElementById('f-id').value = '';
    document.getElementById('f-id').disabled = false;
    document.getElementById('f-sender').value = '';
    document.getElementById('f-recipient').value = '';
    document.getElementById('f-address').value = '';
    document.getElementById('f-weight').value = '';
    document.getElementById('f-status').value = 'Pending';
    document.getElementById('modal-error').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('deliveryModal')).show();
  }

  // ── Open edit modal ───────────────────────────────────────────────────────
  async function openEditModal(id) {
    editingId = id;
    document.getElementById('modal-title').textContent = `Edit Delivery – ${id}`;
    document.getElementById('modal-error').classList.add('d-none');
    try {
      const res = await fetch(`${API}/${id}`);
      const d = await res.json();
      document.getElementById('f-id').value = d.id;
      document.getElementById('f-id').disabled = true;
      document.getElementById('f-sender').value = d.senderName;
      document.getElementById('f-recipient').value = d.recipientName;
      document.getElementById('f-address').value = d.address;
      document.getElementById('f-weight').value = d.weight;
      document.getElementById('f-status').value = d.status;
      new bootstrap.Modal(document.getElementById('deliveryModal')).show();
    } catch {
      showToast('Could not load delivery.', 'danger');
    }
  }

  // ── Save (create or update) ───────────────────────────────────────────────
  async function saveDelivery() {
    const body = {
      id:            document.getElementById('f-id').value.trim(),
      senderName:    document.getElementById('f-sender').value.trim(),
      recipientName: document.getElementById('f-recipient').value.trim(),
      address:       document.getElementById('f-address').value.trim(),
      weight:        parseFloat(document.getElementById('f-weight').value),
      status:        document.getElementById('f-status').value,
    };

    // Basic validation
    if (!body.id || !body.senderName || !body.recipientName || !body.address || !body.weight) {
      showModalError('Please fill in all required fields.'); return;
    }
    if (body.weight <= 0) {
      showModalError('Weight must be greater than 0.'); return;
    }

    const isEdit = editingId !== null;
    const url    = isEdit ? `${API}/${editingId}` : API;
    const method = isEdit ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        showModalError(data.error || 'An error occurred.'); return;
      }
      bootstrap.Modal.getInstance(document.getElementById('deliveryModal')).hide();
      showToast(isEdit ? `Delivery ${editingId} updated.` : `Delivery ${data.id} created.`, 'success');
      refresh();
    } catch {
      showModalError('Server error. Please try again.');
    }
  }

  // ── Delete ────────────────────────────────────────────────────────────────
  function openDeleteModal(id) {
    deletingId = id;
    document.getElementById('delete-id-label').textContent = id;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
  }

  async function confirmDelete() {
    try {
      const res = await fetch(`${API}/${deletingId}`, { method: 'DELETE' });
      bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
      if (res.ok) {
        showToast(`Delivery ${deletingId} deleted.`, 'success');
        refresh();
      } else {
        showToast('Delete failed.', 'danger');
      }
    } catch {
      showToast('Server error.', 'danger');
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function refresh() { loadDeliveries(); loadStats(); }

  function showModalError(msg) {
    const el = document.getElementById('modal-error');
    el.textContent = msg;
    el.classList.remove('d-none');
  }

  function showToast(msg, type = 'success') {
    const id = 'toast-' + Date.now();
    const colors = { success: '#198754', danger: '#dc3545', info: '#0dcaf0' };
    const html = `
      <div id="${id}" class="toast-msg p-3 text-white mb-2"
           style="background:${colors[type]||'#333'};border-radius:10px;
                  box-shadow:0 4px 12px rgba(0,0,0,.15)">
        ${msg}
      </div>`;
    const container = document.getElementById('toast-container');
    container.insertAdjacentHTML('beforeend', html);
    setTimeout(() => document.getElementById(id)?.remove(), 3000);
  }

  // ── Search on Enter ───────────────────────────────────────────────────────
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadDeliveries();
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  refresh();
</script>
</body>
</html>
